name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_MANIFEST_PATH: src-tauri/Cargo.toml

jobs:
  ci-check:
    name: Pre-release CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.label }})
    needs: [ci-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            label: macOS
            target: x86_64-apple-darwin
          - os: windows-latest
            label: Windows
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Litetify ${{ github.ref_name }}'
          releaseBody: |
            ## Litetify ${{ github.ref_name }}

            See [changelog.md](../../blob/main/changelog.md) for full details.

            ### Installation
            - **Windows:** Download and run the `.msi` or `.exe` installer
            - **macOS:** Mount the `.dmg` and drag to Applications
            - **Linux:** Install the `.deb` or `.AppImage`

            ### Upgrade Notes
            This release supports in-app updates via the built-in updater.
            If you're running a previous version, the app will notify you automatically.
          releaseDraft: true
          prerelease: false
