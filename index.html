<!doctype html>
<html lang="en" autocomplete="off">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/litetify.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Litetify</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https://*.scdn.co https://*.spotifycdn.com; connect-src 'self' https://api.spotify.com https://accounts.spotify.com ipc: http://ipc.localhost; script-src 'self' blob: https://sdk.scdn.co; style-src 'self' 'unsafe-inline'; frame-src 'self' https://sdk.scdn.co"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #08090b;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #08090b;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      #boot.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot .spinner {
        position: relative;
        width: 148px;
        height: 148px;
        opacity: 1;
        transition: opacity 0.2s ease;
      }
      #boot.is-ready .spinner {
        opacity: 0;
      }
      #boot .ring {
        position: absolute;
        inset: 0;
      }
      #boot .ring svg,
      #boot .mark svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      #boot .ring svg {
        transform-origin: 50% 50%;
        animation: boot-spin 0.7s linear infinite;
      }
      #boot .ring circle {
        fill: none;
        stroke: #2a3138;
        stroke-width: 5;
      }
      #boot .ring .arc {
        stroke: #fff;
        stroke-linecap: round;
        stroke-dasharray: 33 99;
      }
      #boot .mark {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot .mark svg {
        width: 84px;
        height: 84px;
        animation: boot-breathe 1.6s ease-in-out infinite;
      }
      @keyframes boot-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-breathe {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite" aria-label="Loading">
      <div class="spinner">
        <span class="ring" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="21" />
            <circle class="arc" cx="24" cy="24" r="21" />
          </svg>
        </span>
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 120 120">
            <defs>
              <clipPath id="litetify-boot-clip">
                <path
                  d="M88 10 C101 34 98 60 72 82 C60 92 38 95 28 96 C30 82 38 64 52 48 C62 37 76 20 88 10 Z"
                />
              </clipPath>
            </defs>
            <path
              d="M88 10 C101 34 98 60 72 82 C60 92 38 95 28 96 C30 82 38 64 52 48 C62 37 76 20 88 10 Z"
              fill="#fff"
            />
            <g clip-path="url(#litetify-boot-clip)">
              <g fill="#56606D">
                <circle cx="31" cy="93" r="1.6" />
                <path
                  d="M29.68 92.1 L69.64 33.78 L73.14 29.03 L76.87 24.44 L80.63 19.88 L83.07 16.79 L84.82 14.42 L85.67 13.22 L84.85 14.44 L83.27 16.93 L81.27 20.32 L78.37 25.48 L75.44 30.61 L72.28 35.58 L32.32 93.9 Z"
                />
              </g>
              <g stroke="#000" stroke-width="2" stroke-linecap="round">
                <path d="M41 78 L56 75" />
                <path d="M48 68 L63 65" />
                <path d="M55 58 L70 55" />
                <path d="M62 48 L75 45" />
                <path d="M69 37 L81 34" />
              </g>
            </g>
            <path
              d="M28 96 L20 106"
              fill="none"
              stroke="#fff"
              stroke-width="5"
              stroke-linecap="round"
            />
          </svg>
        </span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
